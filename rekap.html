<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rekapitulasi NALA-CSR Kelas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    /* Background Gambar Kebersihan & Penghijauan dengan Overlay Gradasi Bernuansa Biru */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(30, 58, 138, 0.82), rgba(14, 116, 144, 0.85)),
                  url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 0;
      padding-bottom: 60px; /* Space bawah agar tidak tertutup footnote di HP */
    }
  </style>
</head>
<body class="p-2.5 sm:p-6 items-center justify-center">

  <!-- CONTAINER UTAMA (RESPONSIVE FOR MOBILE) -->
  <div class="w-full max-w-3xl bg-white/95 backdrop-blur-xl rounded-2xl sm:rounded-3xl shadow-2xl border border-blue-100/50 overflow-hidden my-auto mx-auto">
    
    <!-- HEADER -->
    <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-900 p-5 sm:p-8 text-white relative overflow-hidden border-b border-blue-500/20">
      <div class="absolute -right-10 -bottom-10 w-32 h-32 sm:w-40 sm:h-40 bg-blue-500/20 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -left-10 -top-10 w-32 h-32 sm:w-40 sm:h-40 bg-cyan-500/20 rounded-full blur-2xl pointer-events-none"></div>

      <div class="relative z-10 text-center flex flex-col items-center">
        <!-- LOGO SMAN TARUNA NALA -->
        <img src="https://lh3.googleusercontent.com/d/1erlU3Wwr8NuIusv6FXvG3qahEv7D1eQL" alt="Logo SMAN Taruna Nala" class="w-14 h-14 sm:w-20 sm:h-20 object-contain filter drop-shadow-md mb-2.5">

        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-500/20 backdrop-blur-md border border-blue-400/30 text-[11px] sm:text-xs font-semibold text-cyan-200 mb-2.5 shadow-inner">
          <i data-lucide="bar-chart-3" class="w-3.5 h-3.5 text-cyan-300"></i>
          <span>Portal Rekapitulasi Digital</span>
        </div>
        <h1 class="text-xl sm:text-3xl font-black tracking-tight text-white drop-shadow-sm leading-tight">REKAPITULASI NALA-CSR</h1>
        <p class="text-[11px] sm:text-sm text-blue-200/90 mt-1 max-w-md mx-auto font-medium">Laporan Penilaian Harian & Progress Karakter Kelas</p>
      </div>
    </div>

    <!-- 1. GERBANG AKSES TOKEN (OPTIMAL UNTUK HP) -->
    <div id="authSection" class="p-4 sm:p-10 max-w-md mx-auto space-y-5 sm:space-y-6">
      <div class="text-center">
        <div class="w-12 h-12 sm:w-14 sm:h-14 bg-blue-50 text-blue-600 rounded-2xl border border-blue-100 flex items-center justify-center mx-auto mb-2.5 shadow-sm">
          <i data-lucide="key-round" class="w-6 h-6 sm:w-7 sm:h-7"></i>
        </div>
        <h2 class="text-base sm:text-lg font-bold text-slate-800">Akses Rekapitulasi</h2>
        <p class="text-xs text-slate-500 mt-0.5">Pilih kelas dan masukkan token akses khusus kelas Anda</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-blue-950 uppercase tracking-wider mb-1.5">Pilih Kelas</label>
          <div class="relative">
            <select id="authKelas" class="w-full bg-blue-50/50 border border-blue-200/80 rounded-xl px-3.5 py-3 text-sm font-semibold text-slate-800 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition appearance-none">
              <option value="">-- Pilih Kelas --</option>
              <!-- KELAS X -->
              <option value="X-1">X-1</option>
              <option value="X-2">X-2</option>
              <option value="X-3">X-3</option>
              <option value="X-4">X-4</option>
              <option value="X-5">X-5</option>
              <option value="X-6">X-6</option>
              <!-- KELAS XI -->
              <option value="XI-1">XI-1</option>
              <option value="XI-2">XI-2</option>
              <option value="XI-3">XI-3</option>
              <option value="XI-4">XI-4</option>
              <option value="XI-5">XI-5</option>
              <option value="XI-6">XI-6</option>
              <option value="XI-7">XI-7</option>
              <option value="XI-8">XI-8</option>
              <!-- KELAS XII -->
              <option value="XII-1">XII-1</option>
              <option value="XII-2">XII-2</option>
              <option value="XII-3">XII-3</option>
              <option value="XII-4">XII-4</option>
              <option value="XII-5">XII-5</option>
              <option value="XII-6">XII-6</option>
              <option value="XII-7">XII-7</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-blue-400 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-blue-950 uppercase tracking-wider mb-1.5">Token Kelas</label>
          <div class="relative">
            <input type="password" id="authToken" placeholder="Masukkan Token Kelas..." class="w-full bg-blue-50/50 border border-blue-200/80 rounded-xl px-3.5 py-3 text-sm font-medium text-slate-800 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition placeholder:text-blue-300">
            <i data-lucide="lock" class="w-4 h-4 text-blue-400 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>
        </div>

        <button onclick="verifyToken()" id="btnAuth" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-600/25 transition duration-200 flex items-center justify-center gap-2">
          <i data-lucide="shield-check" class="w-4 h-4"></i> Masuk Rekapitulasi
        </button>

        <p id="authError" class="text-blue-900 text-xs text-center font-semibold hidden bg-blue-50 p-3 rounded-xl border border-blue-200 flex items-center justify-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 text-blue-600 shrink-0"></i>
          <span id="authErrorText"></span>
        </p>
      </div>
    </div>

    <!-- 2. DASHBOARD REKAPITULASI (MOBILE RESPONSIVE LAYOUT) -->
    <div id="recapSection" class="hidden p-4 sm:p-8 space-y-5 sm:space-y-6">
      
      <!-- TOP BAR INFO KELAS & LOGOUT -->
      <div class="flex flex-row justify-between items-center gap-2 bg-blue-50/60 backdrop-blur p-3 sm:p-4 rounded-2xl border border-blue-100">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 sm:w-10 sm:h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-black text-base sm:text-lg shadow-md shadow-blue-600/20 shrink-0">
            <i data-lucide="users" class="w-4 h-4 sm:w-5 sm:h-5"></i>
          </div>
          <div>
            <span class="text-[10px] sm:text-[11px] font-bold text-blue-600/80 uppercase tracking-wider block">Rekapitulasi Kelas</span>
            <h2 id="activeKelasDisplay" class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight"></h2>
          </div>
        </div>
        <button onclick="location.reload()" class="text-xs font-bold text-blue-700 hover:text-blue-900 transition flex items-center gap-1 bg-white px-3 py-2 rounded-xl border border-blue-200 shadow-xs hover:bg-blue-50 shrink-0">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Keluar</span>
        </button>
      </div>

      <!-- FILTER RENTANG TANGGAL (1 KOLOM DI HP, 3 KOLOM DI LAPTOP) -->
      <div class="bg-blue-50/30 p-3.5 sm:p-4 rounded-2xl border border-blue-100 space-y-3">
        <div class="flex items-center gap-2 text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">
          <i data-lucide="calendar" class="w-4 h-4 text-blue-600"></i>
          <span>Filter Periode Tanggal</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-3 items-end">
          <div>
            <label class="block text-[11px] font-semibold text-blue-800 mb-1">Dari Tanggal</label>
            <input type="date" id="startDateInput" class="w-full bg-white border border-blue-200 rounded-xl p-2.5 text-xs font-semibold text-slate-700 focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-blue-800 mb-1">Sampai Tanggal</label>
            <input type="date" id="endDateInput" class="w-full bg-white border border-blue-200 rounded-xl p-2.5 text-xs font-semibold text-slate-700 focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition">
          </div>
          <button onclick="loadRecapData()" id="btnFilter" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white py-2.5 px-4 rounded-xl font-bold text-xs shadow-md shadow-blue-600/20 transition flex items-center justify-center gap-2 h-[42px] sm:h-[40px] mt-1 sm:mt-0">
            <i data-lucide="filter" class="w-4 h-4"></i> Tampilkan Rekap
          </button>
        </div>
      </div>

      <!-- KONTEN REKAPITULASI HASIL -->
      <div id="recapContent" class="space-y-4"></div>

    </div>

  </div>

  <!-- FOOTNOTE / FOOTER FULL WIDTH MEMANJANG DIPASANG KELUAR DIPASANG FIX BOTTOM -->
  <footer class="fixed bottom-0 left-0 w-full bg-[#0d2a45]/95 backdrop-blur-md py-2.5 px-2 text-center z-50 border-t border-blue-900/50 shadow-lg">
    <p class="text-[10px] sm:text-xs font-semibold text-slate-300 tracking-wide truncate">
      &copy; SMAN Taruna Nala Jawa Timur | Nala-CSR System
    </p>
  </footer>

  <script>
    const RECAP_GAS_URL = "https://script.google.com/macros/s/AKfycbz4QNvwO3iBQhF48wR4cFJHYJ9M6eGkzuC1NS8c7uZMX0Orl1zLX4cubFh4tfJAoSGTFg/exec";

    let authenticatedKelas = "";

    function getJakartaDateString() {
      const options = { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' };
      return new Intl.DateTimeFormat('en-CA', options).format(new Date());
    }

    const todayJakarta = getJakartaDateString();
    document.getElementById('startDateInput').value = todayJakarta;
    document.getElementById('endDateInput').value = todayJakarta;
    lucide.createIcons();

    async function sendApiRequest(data) {
      const formData = new URLSearchParams();
      formData.append("data", JSON.stringify(data));
      const res = await fetch(RECAP_GAS_URL, { method: "POST", body: formData });
      return await res.json();
    }

    async function verifyToken() {
      const kelas = document.getElementById('authKelas').value;
      const token = document.getElementById('authToken').value;
      const btn = document.getElementById('btnAuth');
      const err = document.getElementById('authError');
      const errText = document.getElementById('authErrorText');

      if (!kelas || !token) {
        errText.innerText = "Pilih kelas dan masukkan token!";
        err.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memeriksa...`;
      lucide.createIcons();
      err.classList.add('hidden');

      try {
        const res = await sendApiRequest({ action: 'verifyToken', kelas: kelas, token: token });
        if (res.success) {
          authenticatedKelas = kelas;
          document.getElementById('activeKelasDisplay').innerText = `Kelas ${kelas}`;
          document.getElementById('authSection').classList.add('hidden');
          document.getElementById('recapSection').classList.remove('hidden');
          loadRecapData();
        } else {
          errText.innerText = res.message;
          err.classList.remove('hidden');
        }
      } catch (e) {
        errText.innerText = "Gagal terhubung ke Server.";
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="shield-check" class="w-4 h-4"></i> Masuk Rekapitulasi`;
        lucide.createIcons();
      }
    }

    async function loadRecapData() {
      const start = document.getElementById('startDateInput').value;
      const end = document.getElementById('endDateInput').value;
      const container = document.getElementById('recapContent');

      if (!start || !end) return;

      container.innerHTML = `
        <div class="text-center py-10 bg-blue-50/40 rounded-2xl border border-dashed border-blue-200">
          <i data-lucide="loader-2" class="w-7 h-7 sm:w-8 sm:h-8 animate-spin mx-auto mb-2 text-blue-600"></i>
          <p class="text-xs font-bold text-blue-900">Memuat rekapitulasi data...</p>
          <p class="text-[10px] sm:text-[11px] text-blue-500 mt-0.5">Mohon tunggu sebentar</p>
        </div>
      `;
      lucide.createIcons();

      try {
        const res = await sendApiRequest({ action: 'getRecapByRange', kelas: authenticatedKelas, startDate: start, endDate: end });

        if (!res.rekap || res.rekap.length === 0) {
          container.innerHTML = `
            <div class="p-6 sm:p-8 bg-blue-50/60 border border-blue-200 rounded-2xl text-center">
              <div class="w-9 h-9 sm:w-10 sm:h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2">
                <i data-lucide="info" class="w-5 h-5"></i>
              </div>
              <p class="text-xs font-bold text-blue-950">Data Tidak Ditemukan</p>
              <p class="text-[11px] text-blue-700 mt-1">Tidak ada data rekapitulasi pada rentang tanggal terpilih.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        res.rekap.sort((a, b) => a.tanggal.localeCompare(b.tanggal));

        let html = '';

        res.rekap.forEach(item => {
          item.detailJp.sort((a, b) => Number(a.jamKe) - Number(b.jamKe));

          html += `
            <div class="border border-blue-100 rounded-2xl p-4 sm:p-5 bg-white shadow-xs hover:shadow-md hover:border-blue-200 transition space-y-3.5 relative overflow-hidden">
              <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-600"></div>

              <div class="flex justify-between items-center border-b border-blue-50 pb-2.5 pl-1.5">
                <div>
                  <span class="text-[9px] sm:text-[10px] font-bold text-blue-400 uppercase tracking-wider block">Tanggal</span>
                  <p class="text-xs sm:text-sm font-extrabold text-slate-800 flex items-center gap-1.5 mt-0.5">
                    <i data-lucide="calendar-days" class="w-3.5 h-3.5 text-blue-600 shrink-0"></i>
                    ${item.tanggal}
                  </p>
                </div>
                <div class="text-right">
                  <span class="text-[9px] sm:text-[10px] font-bold text-blue-400 uppercase tracking-wider block">Total Skor Harian</span>
                  <p class="text-base sm:text-lg font-black text-blue-600 flex items-center justify-end gap-1">
                    ${item.totalSkorHarian} <span class="text-[10px] sm:text-xs font-bold text-slate-400">Poin</span>
                  </p>
                </div>
              </div>

              <div class="space-y-2 pl-1.5">
                <div class="flex items-center justify-between">
                  <p class="text-[11px] sm:text-xs font-bold text-slate-700">Rincian Pengisian Nilai Guru</p>
                  <span class="text-[9px] sm:text-[10px] text-blue-400 font-medium">(Maks. 7 JP)</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          `;

          item.detailJp.forEach(jp => {
            html += `
              <div class="bg-blue-50/40 p-2.5 sm:p-3 rounded-xl border border-blue-100 text-xs flex justify-between items-start gap-2.5 hover:bg-blue-50/80 transition">
                <div class="flex-1 space-y-1 min-w-0">
                  <div class="inline-block bg-blue-600 text-white font-extrabold text-[9px] sm:text-[10px] px-2 py-0.5 rounded-md shadow-xs">
                    Jam Ke-${jp.jamKe}
                  </div>
                  <p class="text-slate-800 font-semibold text-[11px] leading-tight truncate">${jp.namaGuru}</p>
                  ${jp.catatan ? `
                    <div class="bg-blue-100/50 border border-blue-200/60 p-2 rounded-lg mt-1">
                      <p class="text-[10px] sm:text-[11px] text-blue-900 italic leading-snug break-words">"${jp.catatan}"</p>
                    </div>
                  ` : ''}
                </div>
                <div class="text-right shrink-0">
                  <span class="text-[9px] text-blue-400 font-bold block">Skor</span>
                  <span class="font-black text-xs sm:text-sm text-blue-700">${jp.skor}</span>
                </div>
              </div>
            `;
          });

          html += `
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (e) {
        container.innerHTML = `
          <div class="p-4 bg-blue-50 border border-blue-200 rounded-xl text-center text-xs text-blue-800 font-semibold flex items-center justify-center gap-2">
            <i data-lucide="alert-triangle" class="w-4 h-4 text-blue-600"></i>
            Gagal memuat rekapitulasi data. Silakan coba lagi.
          </div>
        `;
      } finally {
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
